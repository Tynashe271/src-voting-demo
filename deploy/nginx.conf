limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
server {
    listen 80;
    server_name _;
    client_max_body_size 1m;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: https:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        add_header Cache-Control "no-store" always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api:8080;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location = /sw.js { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
